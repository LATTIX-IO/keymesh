# PR packaging has read-only authority. Only protected main gets signing.
# Release evidence is NOT approval to publish to a registry.
name: Candidate SBOM and signed provenance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Candidate package and CycloneDX SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - name: Install pinned CycloneDX generator
        run: cargo install --locked --version 0.5.9 cargo-cyclonedx

      - name: Build candidate and inspect independently packaged consumer
        run: |
          bash scripts/test_packaged_consumer.sh
          bash scripts/generate_candidate_evidence.sh

      - name: Upload non-release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keymesh-candidate-${{ github.sha }}
          path: target/release-evidence/
          if-no-files-found: error
          retention-days: 30

  attest-main:
    name: Attest protected main candidate
    needs: candidate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download exact candidate package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: keymesh-candidate-${{ github.sha }}
          path: candidate-evidence

      - name: Validate uploaded archive and BOM hashes
        run: (cd candidate-evidence && sha256sum -c SHA256SUMS)

      - name: Resolve exact SBOM path
        id: sbom
        run: |
          BOM="$(find candidate-evidence -maxdepth 1 -type f -name '*.cdx.json' -print -quit)"
          test -n "$BOM"
          echo "path=$BOM" >> "$GITHUB_OUTPUT"

      - name: Create signed build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: candidate-evidence/*.crate

      - name: Bind signed CycloneDX SBOM to exact crate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: candidate-evidence/*.crate
          sbom-path: ${{ steps.sbom.outputs.path }}

      - name: Verify signed provenance and CycloneDX attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for predicate in https://slsa.dev/provenance/v1 https://cyclonedx.org/bom; do
            verified=0
            for i in 1 2 3 4 5; do
              if gh attestation verify candidate-evidence/*.crate \
                --repo "$GITHUB_REPOSITORY" --predicate-type "$predicate"; then
                verified=1
                break
              fi
              sleep 5
            done
            if [ "$verified" != 1 ]; then
              echo "Required attestation not verified: $predicate" >&2
              exit 1
            fi
          done
