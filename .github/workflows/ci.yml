name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-safety:
    name: Bootstrap publication guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate publication safeguards
        run: python3 scripts/check_release_safety.py

      - name: Test negative publication scenarios
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate generated KM-02 Rust fixtures
        run: python3 scripts/generate_km02_contract.py --check

  # Temporary non-publishing bootstrap aid for KM-04 dependency/format snapshot.
  # This job is removed in the same PR before merge.
  km04-snapshot:
    name: KM-04 temporary lockfile and rustfmt snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install formatter and Cargo
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Resolve pinned dependencies and format code (read-only snapshot)
        run: |
          cargo generate-lockfile
          cargo fmt --all
          python3 - <<'PY'
          import base64
          import json
          import pathlib
          import subprocess
          paths = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          result = []
          for path in paths:
              raw = pathlib.Path(path).read_bytes()
              result.append({"path": path, "base64": base64.b64encode(raw).decode("ascii")})
          print("KM04_SNAPSHOT_BEGIN")
          print(json.dumps(result, separators=(",", ":")))
          print("KM04_SNAPSHOT_END")
          PY

  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Execute KeyRef URI consumer example
        run: cargo run --locked -p keymesh --example keyref_uri

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Install supply-chain tools
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny
          cargo install --locked cargo-semver-checks

      - name: RustSec audit
        run: cargo audit

      - name: Dependency policy
        run: cargo deny check

      - name: SemVer compatibility
        run: cargo semver-checks check-release --workspace --all-features

  rust-msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install declared minimum Rust 1.85.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned action
        with:
          toolchain: 1.85.0

      - name: Check workspace and examples at MSRV
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Test workspace at MSRV
        run: cargo test --workspace --all-features --locked

      - name: Execute KeyRef URI consumer example at MSRV
        run: cargo run --locked -p keymesh --example keyref_uri
