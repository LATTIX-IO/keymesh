name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-safety:
    name: Bootstrap publication guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate publication safeguards
        run: python3 scripts/check_release_safety.py

      - name: Test negative publication scenarios
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate generated KM-02 Rust fixtures
        run: python3 scripts/generate_km02_contract.py --check

  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Check default-disabled software build
        run: cargo check --locked -p keymesh --all-targets --no-default-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Execute KeyRef URI consumer example
        run: cargo run --locked -p keymesh --example keyref_uri

      - name: Execute capability admission example
        run: cargo run --locked -p keymesh --example capability_admission

      - name: Execute provider contract example
        run: cargo run --locked -p keymesh --example provider_contract

      - name: Execute provider registry example
        run: cargo run --locked -p keymesh --example provider_registry

      - name: Execute scoped credential example
        run: cargo run --locked -p keymesh --example credential_boundary

      - name: Execute opt-in real Ed25519 software example
        run: cargo run --locked -p keymesh --features software-provider --example software_ed25519

      - name: Execute version-safe rotation consumer
        run: cargo run --locked -p keymesh --features software-provider --example software_rotation

      - name: Independently packaged consumer acceptance
        run: bash scripts/test_packaged_consumer.sh

      - name: Check standalone manual Keymesh tour
        run: cargo check --manifest-path labs/keymesh-tour/Cargo.toml

      - name: Exercise individual tour commands against the real provider
        run: |
          printf '%s\n' \
            scope capabilities route 'health healthy' route status create-denied create \
            uri 'sign approve payment 481' verify tamper export-public \
            'sign-alias review project approval' verify \
            policy-deny policy-unknown require-hsm require-material audit-fail cross-tenant \
            rotate verify retired-sign stale-rotate disable 'sign while disabled' enable \
            purge-old verify 'sign current version' verify reset status quit \
            | cargo run --quiet --manifest-path labs/keymesh-tour/Cargo.toml \
            | tee /tmp/keymesh-tour-output.txt
          grep -q 'cryptographic signature verification=true' /tmp/keymesh-tour-output.txt
          grep -q 'cryptographic signature verification=false' /tmp/keymesh-tour-output.txt
          grep -q 'REJECTED signing with retired key:' /tmp/keymesh-tour-output.txt
          grep -q 'REJECTED rotation: kind=UnsupportedVersionAssurance' /tmp/keymesh-tour-output.txt
          grep -q 'REJECTED cross-tenant substitution: kind=ScopeMismatch' /tmp/keymesh-tour-output.txt
          grep -q 'NO KEY: fresh provider contains no keys' /tmp/keymesh-tour-output.txt

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Verify manual release preview script in PR CI
        run: bash scripts/release_candidate_preflight.sh

      - name: Install supply-chain tools
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny
          cargo install --locked cargo-semver-checks

      - name: RustSec audit
        run: cargo audit

      - name: Dependency policy
        run: cargo deny check

      - name: SemVer compatibility
        run: cargo semver-checks check-release --workspace --all-features

  rust-msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install declared minimum Rust 1.85.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned action
        with:
          toolchain: 1.85.0

      - name: Check workspace and examples at MSRV
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Check software-provider omitted at MSRV
        run: cargo check --locked -p keymesh --all-targets --no-default-features

      - name: Check independent tour package at MSRV
        run: cargo check --manifest-path labs/keymesh-tour/Cargo.toml

      - name: Test workspace at MSRV
        run: cargo test --workspace --all-features --locked

      - name: Execute KeyRef URI consumer example at MSRV
        run: cargo run --locked -p keymesh --example keyref_uri

      - name: Execute capability admission example at MSRV
        run: cargo run --locked -p keymesh --example capability_admission

      - name: Execute provider contract example at MSRV
        run: cargo run --locked -p keymesh --example provider_contract

      - name: Execute provider registry example at MSRV
        run: cargo run --locked -p keymesh --example provider_registry

      - name: Execute scoped credential example at MSRV
        run: cargo run --locked -p keymesh --example credential_boundary

      - name: Execute opt-in Ed25519 software example at MSRV
        run: cargo run --locked -p keymesh --features software-provider --example software_ed25519

      - name: Execute version-safe rotation consumer at MSRV
        run: cargo run --locked -p keymesh --features software-provider --example software_rotation
