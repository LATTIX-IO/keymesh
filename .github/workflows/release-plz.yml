# Bootstrap release workflow: a read-only, manually invoked readiness preview.
# Registry publication is deliberately out of scope until a reviewed release PR.
name: Release readiness (non-publishing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Non-publishing readiness preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Assert non-publishing posture
        run: python3 scripts/check_release_safety.py

      - name: Validate workspace manifests (offline from any registry publish)
        run: cargo metadata --workspace --no-deps --locked --format-version 1 > /dev/null

      - name: Validate release candidate and print candidate SHA-256 evidence
        run: bash scripts/release_candidate_preflight.sh
