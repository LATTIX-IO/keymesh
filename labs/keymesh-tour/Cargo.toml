[package]
name = "keymesh-tour"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Hands-on, separate-process, non-publishing Keymesh manual acceptance lab"

[dependencies]
keymesh = { path = "../../crates/keymesh", features = ["software-provider"] }

# This is a standalone consumer, not a member of the library workspace.
[workspace]
resolver = "3"
