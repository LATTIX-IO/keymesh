[package]
name = "keymesh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Provider-neutral typed key operations and version-safe ephemeral Ed25519 signing for Rust."
keywords = ["cryptography", "key-management", "security", "ed25519"]
categories = ["cryptography", "authentication"]
readme = "README.md"

# This is an unreleased bootstrap package. Publication must be enabled only
# in an explicitly approved release PR after documented acceptance gates pass.
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
# RustCrypto volatile-backed zeroization; exactly pinned, default derive features disabled.
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
# Feature-gated software provider only; no default software fallback.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"], optional = true }
getrandom = { version = "=0.2.17", optional = true }

[features]
default = []
software-provider = ["dep:ed25519-dalek", "dep:getrandom"]

[dev-dependencies]
serde_json = "=1.0.154"

[[example]]
name = "software_ed25519"
required-features = ["software-provider"]

[[example]]
name = "software_rotation"
required-features = ["software-provider"]

[[test]]
name = "software_provider"
required-features = ["software-provider"]

[[test]]
name = "software_lifecycle"
required-features = ["software-provider"]

[lints]
workspace = true
