[package]
name = "keymesh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "keymesh library for the keymesh project."
readme = "README.md"

# This is an unreleased bootstrap package. Publication must be enabled only
# in an explicitly approved release PR after documented acceptance gates pass.
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
# RustCrypto volatile-backed zeroization; exactly pinned, default derive features disabled.
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_json = "=1.0.145"

[lints]
workspace = true
